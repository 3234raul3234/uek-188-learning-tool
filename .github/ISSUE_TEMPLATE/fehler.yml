name: 🐞 Report a bug
description: Something does not work
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the top of the Lab Trainer, e.g. "Beta 0.5"
    validations:
      required: true
  - type: input
    id: lab
    attributes:
      label: Which lab?
      description: Number, or "Installation" / "Lab Trainer"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, and what happened then?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: output
    attributes:
      label: Error message or screenshot
      description: Paste text from the Lab Trainer here or drag in an image
