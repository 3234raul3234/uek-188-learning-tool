name: 💡 Suggest an idea
description: A new lab or an improvement
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should be added or improved?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How does it help?
      description: e.g. fits a course day or a learning objective
